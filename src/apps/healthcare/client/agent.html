<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Agent Desktop — Owl Health</title>
<script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.18.2/dist/twilio.min.js"></script>
<style>
:root{--primary:#F22F46;--primary-dark:#c0192b;--primary-light:#fff0f2;--dark:#0D122B;--dark-light:#e8e9ef;--text:#323438;--text-muted:#6b7280;--border:#e2e2e8;--white:#ffffff;--bg:#f8f8fc;--radius:10px;--shadow:0 2px 12px rgba(13,18,43,.08);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);}
/* ── Layout ── */
.layout{display:flex;height:100vh;}
/* ── Left sidebar ── */
.sidebar{width:280px;background:var(--dark);display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-header{padding:16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px;}
.sidebar-header img{height:28px;}
.sidebar-header .badge{font-size:11px;font-weight:600;background:var(--primary);color:#fff;padding:2px 8px;border-radius:10px;margin-left:auto;}
.sidebar-search{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-search input{width:100%;background:rgba(255,255,255,.08);border:none;border-radius:6px;padding:7px 10px;color:#fff;font-size:13px;outline:none;}
.sidebar-search input::placeholder{color:rgba(255,255,255,.4);}
.member-list{flex:1;overflow-y:auto;padding:6px 0;}
.member-list::-webkit-scrollbar{width:4px;}
.member-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}
.member-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background .15s;border-left:3px solid transparent;}
.member-item:hover{background:rgba(255,255,255,.06);}
.member-item.active{background:rgba(242,47,70,.15);border-left-color:var(--primary);}
.member-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;}
.member-info{flex:1;min-width:0;}
.member-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.member-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.status-dot.pending{background:#6b7280;}
.status-dot.in-progress,.status-dot.in_progress{background:#3b82f6;}
.status-dot.completed{background:#10b981;}
/* ── Center ── */
.center{flex:1;display:flex;flex-direction:column;min-width:0;}
.call-bar{background:var(--white);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;min-height:58px;}
.call-status{font-size:13px;font-weight:600;color:var(--text-muted);flex:1;}
.call-status.active{color:#16a34a;}
.call-timer{font-size:13px;font-weight:700;color:var(--dark);font-variant-numeric:tabular-nums;min-width:48px;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#16a34a;animation:pulse 1.5s ease-in-out infinite;display:none;}
.live-dot.on{display:inline-block;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .15s;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-call{background:#16a34a;color:#fff;}
.btn-call:hover:not(:disabled){background:#15803d;}
.btn-hangup{background:#dc2626;color:#fff;}
.btn-hangup:hover:not(:disabled){background:#b91c1c;}
.btn-mute{background:var(--dark-light);color:var(--dark);}
.btn-mute:hover:not(:disabled){background:#d1d5db;}
.btn-mute.muted{background:#dc2626;color:#fff;}
.btn-escalate{background:var(--primary-light);color:var(--primary-dark);border:1px solid #fca5a5;}
.btn-escalate:hover:not(:disabled){background:var(--primary);color:#fff;}
.btn-sm{padding:5px 10px;font-size:12px;}
.transcript-panel{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:var(--bg);}
.transcript-panel::-webkit-scrollbar{width:5px;}
.transcript-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.transcript-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:14px;flex-direction:column;gap:10px;}
.transcript-empty svg{opacity:.3;}
.bubble-wrap{display:flex;flex-direction:column;max-width:72%;}
.bubble-wrap.agent{align-self:flex-end;align-items:flex-end;}
.bubble-wrap.member{align-self:flex-start;align-items:flex-start;}
.bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5;}
.bubble-wrap.agent .bubble{background:var(--primary);color:#fff;border-bottom-right-radius:3px;}
.bubble-wrap.member .bubble{background:var(--white);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:3px;}
.bubble-meta{font-size:11px;color:var(--text-muted);margin-top:3px;}
/* ── Right panel ── */
.right-panel{width:320px;display:flex;flex-direction:column;background:var(--white);border-left:1px solid var(--border);overflow-y:auto;flex-shrink:0;}
.right-panel::-webkit-scrollbar{width:4px;}
.right-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.rp-section{padding:16px;border-bottom:1px solid var(--border);}
.rp-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);margin-bottom:12px;}
.member-card-top{display:flex;align-items:center;gap:12px;}
.avatar-lg{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;}
.member-card-name{font-size:16px;font-weight:700;color:var(--dark);}
.member-card-id{font-size:12px;color:var(--text-muted);margin-top:2px;}
.trait-row{display:flex;align-items:flex-start;gap:8px;margin-top:8px;font-size:13px;}
.trait-label{color:var(--text-muted);width:80px;flex-shrink:0;}
.trait-value{color:var(--text);font-weight:500;flex:1;}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:var(--primary-light);color:var(--primary-dark);margin:2px 2px 2px 0;}
.ci-card{background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.ci-label{font-size:12px;font-weight:600;color:var(--dark);margin-bottom:4px;}
.ci-result{font-size:12px;color:var(--text-muted);margin-bottom:6px;line-height:1.4;}
.score-bar-wrap{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.score-bar{height:100%;border-radius:3px;background:var(--primary);transition:width .4s;}
.ci-score-label{font-size:11px;color:var(--text-muted);margin-top:3px;}
.actions-grid{display:flex;flex-direction:column;gap:8px;}
.btn-action{width:100%;justify-content:center;padding:9px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;}
.btn-action:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary-dark);}
.btn-action.danger:hover{background:#fef2f2;border-color:#fca5a5;color:#991b1b;}
.rp-empty{color:var(--text-muted);font-size:13px;font-style:italic;text-align:center;padding:20px 0;}
/* ── Incoming call overlay ── */
#incoming-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center;}
#incoming-overlay.show{display:flex;}
.incoming-card{background:#fff;border-radius:14px;padding:32px 40px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.25);max-width:340px;width:100%;}
.incoming-ring{font-size:48px;animation:ring .5s ease-in-out infinite alternate;}
@keyframes ring{from{transform:rotate(-15deg);}to{transform:rotate(15deg);}}
.incoming-title{font-size:18px;font-weight:700;color:var(--dark);margin:12px 0 4px;}
.incoming-from{font-size:14px;color:var(--text-muted);margin-bottom:24px;}
.incoming-btns{display:flex;gap:12px;justify-content:center;}
/* ── Toast ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:10px 22px;border-radius:var(--radius);font-size:14px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:999;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="layout">
  <!-- LEFT: member queue -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="owl-health-logo-3.svg" alt="Owl Health"/>
      <span class="badge" id="queue-count">0</span>
    </div>
    <div class="sidebar-search">
      <input type="text" id="search-input" placeholder="Search members…"/>
    </div>
    <div class="member-list" id="member-list">
      <div style="padding:20px;color:rgba(255,255,255,.4);font-size:13px;text-align:center;">Loading…</div>
    </div>
  </aside>

  <!-- CENTER: call controls + transcript -->
  <main class="center">
    <div class="call-bar" id="call-bar">
      <span class="live-dot" id="live-dot"></span>
      <span class="call-status" id="call-status">No active call</span>
      <span class="call-timer" id="call-timer" style="display:none"></span>
      <button class="btn btn-mute" id="btn-mute" style="display:none" onclick="toggleMute()">🎙 Mute</button>
      <button class="btn btn-hangup" id="btn-hangup" style="display:none" onclick="hangup()">📵 Hang Up</button>
      <button class="btn btn-escalate btn-sm" id="btn-escalate" style="display:none" onclick="escalate()">⬆ Escalate</button>
      <button class="btn btn-call btn-sm" id="btn-call-member" style="display:none" onclick="callMember()">📞 Call Member</button>
    </div>
    <div class="transcript-panel" id="transcript-panel">
      <div class="transcript-empty" id="transcript-empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Select a member to view transcript</span>
      </div>
    </div>
  </main>

  <!-- RIGHT: CRM + CI -->
  <aside class="right-panel" id="right-panel">
    <!-- Profile -->
    <div class="rp-section" id="rp-profile">
      <div class="rp-title">Member Profile</div>
      <div class="rp-empty">No member selected</div>
    </div>
    <!-- CI scores -->
    <div class="rp-section" id="rp-ci">
      <div class="rp-title">Conversation Intelligence</div>
      <div class="rp-empty" id="ci-empty">Waiting for call…</div>
      <div id="ci-cards"></div>
    </div>
    <!-- Actions -->
    <div class="rp-section" id="rp-actions">
      <div class="rp-title">Quick Actions</div>
      <div class="actions-grid">
        <button class="btn-action" onclick="callMember()">📞 Call Member</button>
        <button class="btn-action" onclick="sendSms()">💬 Send SMS</button>
        <button class="btn-action danger" onclick="escalate()">⬆ Escalate to Agent</button>
        <button class="btn-action" id="btn-verify" onclick="startVerify()">🔐 Verify Member</button>
      </div>
      <!-- OTP entry — shown after SMS sent -->
      <div id="verify-otp-row" style="display:none;margin-top:10px;">
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">Enter the code the member provides:</div>
        <div style="display:flex;gap:6px;">
          <input id="otp-input" type="text" maxlength="6" placeholder="6-digit code"
            style="flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:14px;font-weight:600;letter-spacing:3px;outline:none;"/>
          <button class="btn btn-call btn-sm" onclick="checkOtp()">Verify</button>
          <button class="btn btn-sm" style="background:var(--bg);border:1px solid var(--border);" onclick="cancelVerify()">✕</button>
        </div>
        <div id="verify-result" style="margin-top:6px;font-size:12px;font-weight:600;"></div>
      </div>
    </div>
  </aside>
</div>

<!-- Incoming call overlay -->
<div id="incoming-overlay">
  <div class="incoming-card">
    <div class="incoming-ring">📞</div>
    <div class="incoming-title">Incoming Call</div>
    <div class="incoming-from" id="incoming-from">Unknown caller</div>
    <div class="incoming-btns">
      <button class="btn btn-call" onclick="acceptCall()">Accept</button>
      <button class="btn btn-hangup" onclick="rejectCall()">Decline</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script>
// ── State ──────────────────────────────────────────────────────────────────
let members = [];
let selectedMember = null;
let transcriptEs = null;
let ciEs = null;
let twilioDevice = null;
let activeCall = null;
let incomingCall = null;
let callTimerInterval = null;
let callStartTime = null;

const AVATAR_COLORS = ['#6366f1','#8b5cf6','#ec4899','#0ea5e9','#14b8a6','#f59e0b','#10b981','#f97316'];
function avatarColor(name) {
  let h = 0; for (let c of (name||'')) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}

// ── Toast ──────────────────────────────────────────────────────────────────
function toast(msg, dur=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

// ── Member list ────────────────────────────────────────────────────────────
async function loadMembers() {
  try {
    const r = await fetch('api/members');
    const d = await r.json();
    members = d.members || [];
    renderMemberList(members);
  } catch(e) { console.error('loadMembers', e); }
}

function renderMemberList(list) {
  const el = document.getElementById('member-list');
  document.getElementById('queue-count').textContent = list.length;
  if (!list.length) { el.innerHTML = '<div style="padding:20px;color:rgba(255,255,255,.4);font-size:13px;text-align:center;">No members</div>'; return; }
  el.innerHTML = list.map(m => `
    <div class="member-item${selectedMember?.profile_id===m.profile_id?' active':''}" data-id="${m.profile_id}" onclick="selectMember('${m.profile_id}')">
      <div class="member-avatar" style="background:${avatarColor(m.name)}">${m.initials||'?'}</div>
      <div class="member-info">
        <div class="member-name">${m.name||'Unknown'}</div>
        <div class="member-sub">${m.next_follow_up||m.member_id||''}</div>
      </div>
      <div class="status-dot ${(m.status||'pending').replace(/[^a-z_]/gi,'')}"></div>
    </div>`).join('');
}

document.getElementById('search-input').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  renderMemberList(q ? members.filter(m => (m.name||'').toLowerCase().includes(q) || (m.phone||'').includes(q)) : members);
});

// ── Select member ──────────────────────────────────────────────────────────
async function selectMember(profileId) {
  selectedMember = members.find(m => m.profile_id === profileId) || { profile_id: profileId };
  renderMemberList(members);

  // Close old streams
  if (transcriptEs) { transcriptEs.close(); transcriptEs = null; }
  if (ciEs) { ciEs.close(); ciEs = null; }

  // Clear panels
  document.getElementById('transcript-panel').innerHTML = '<div class="transcript-empty"><span>Loading…</span></div>';
  document.getElementById('ci-cards').innerHTML = '';
  document.getElementById('ci-empty').style.display = '';

  // Show call button
  document.getElementById('btn-call-member').style.display = '';
  document.getElementById('btn-escalate').style.display = activeCall ? '' : 'none';

  // Load traits
  loadTraits(profileId);

  // Open transcript SSE
  const transcriptPanel = document.getElementById('transcript-panel');
  transcriptPanel.innerHTML = '';
  let hasMessages = false;
  transcriptEs = new EventSource(`api/transcript/${profileId}/stream`);
  transcriptEs.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (!msg.role) return;
      hasMessages = true;
      appendBubble(msg.role, msg.text, msg.ts);
    } catch {}
  };
  transcriptEs.onerror = () => {
    if (!hasMessages) transcriptPanel.innerHTML = '<div class="transcript-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>No transcript yet</span></div>';
  };

  // Open CI SSE
  ciEs = new EventSource(`api/ci-results/${profileId}/stream`);
  ciEs.onmessage = e => {
    try { renderCI(JSON.parse(e.data)); } catch {}
  };
}

// ── Transcript bubble ──────────────────────────────────────────────────────
function appendBubble(role, text, ts) {
  const panel = document.getElementById('transcript-panel');
  // Remove empty state
  panel.querySelectorAll('.transcript-empty').forEach(el => el.remove());
  const wrap = document.createElement('div');
  wrap.className = `bubble-wrap ${role}`;
  const time = ts ? new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '';
  wrap.innerHTML = `<div class="bubble">${escHtml(text)}</div><div class="bubble-meta">${role==='agent'?'Agent':'Member'}${time?' · '+time:''}</div>`;
  panel.appendChild(wrap);
  panel.scrollTop = panel.scrollHeight;
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Traits / profile ───────────────────────────────────────────────────────
async function loadTraits(profileId) {
  const rp = document.getElementById('rp-profile');
  try {
    const r = await fetch(`api/member-detail/${profileId}/traits`);
    const { contact={}, outreach={} } = await r.json();
    const name = `${contact.firstName||''} ${contact.lastName||''}`.trim() || selectedMember?.name || 'Unknown';
    const initials = ((contact.firstName||'?')[0]+(contact.lastName||'?')[0]).toUpperCase();
    const conditions = (contact.conditions||'').split(',').map(s=>s.trim()).filter(Boolean);
    rp.innerHTML = `
      <div class="rp-title">Member Profile</div>
      <div class="member-card-top">
        <div class="avatar-lg" style="background:${avatarColor(name)}">${initials}</div>
        <div><div class="member-card-name">${escHtml(name)}</div><div class="member-card-id">${contact.memberId||''}</div></div>
      </div>
      <div class="trait-row"><span class="trait-label">Phone</span><span class="trait-value">${contact.phone||'—'}</span></div>
      <div class="trait-row"><span class="trait-label">Plan</span><span class="trait-value">${contact.plan||'—'}</span></div>
      <div class="trait-row"><span class="trait-label">Status</span><span class="trait-value">${outreach.status||'—'}</span></div>
      ${outreach.nextFollowUp?`<div class="trait-row"><span class="trait-label">Follow-up</span><span class="trait-value">${escHtml(outreach.nextFollowUp)}</span></div>`:''}
      ${conditions.length?`<div class="trait-row"><span class="trait-label">Conditions</span><span class="trait-value">${conditions.map(c=>`<span class="pill">${escHtml(c)}</span>`).join('')}</span></div>`:''}
    `;
  } catch {
    rp.innerHTML = '<div class="rp-title">Member Profile</div><div class="rp-empty">Could not load profile</div>';
  }
}

// ── CI rendering ───────────────────────────────────────────────────────────
function renderCI({ operators=[], results={} }) {
  const cards = document.getElementById('ci-cards');
  const empty = document.getElementById('ci-empty');
  if (!operators.length) return;
  empty.style.display = 'none';
  cards.innerHTML = operators.map(op => {
    const r = results[op.sid] || {};
    const score = typeof r.score === 'number' ? r.score : null;
    return `<div class="ci-card">
      <div class="ci-label">${escHtml(op.label||r.label||'')}</div>
      ${r.result?`<div class="ci-result">${escHtml(r.result)}</div>`:'<div class="ci-result" style="color:#9ca3af">Waiting…</div>'}
      ${score!==null?`<div class="score-bar-wrap"><div class="score-bar" style="width:${Math.min(100,Math.max(0,score))}%"></div></div><div class="ci-score-label">Score: ${score}</div>`:''}
    </div>`;
  }).join('');
}

// ── Call controls ──────────────────────────────────────────────────────────
function setCallActive(on, label='') {
  document.getElementById('live-dot').classList.toggle('on', on);
  const status = document.getElementById('call-status');
  status.textContent = on ? (label||'Call in progress') : 'No active call';
  status.className = 'call-status' + (on?' active':'');
  document.getElementById('btn-mute').style.display = on?'':'none';
  document.getElementById('btn-hangup').style.display = on?'':'none';
  document.getElementById('btn-escalate').style.display = on&&selectedMember?'':'none';
  document.getElementById('call-timer').style.display = on?'':'none';
  if (on) { callStartTime = Date.now(); callTimerInterval = setInterval(updateTimer, 1000); }
  else { clearInterval(callTimerInterval); callTimerInterval = null; }
}

function updateTimer() {
  if (!callStartTime) return;
  const s = Math.floor((Date.now()-callStartTime)/1000);
  const mm = String(Math.floor(s/60)).padStart(2,'0'), ss = String(s%60).padStart(2,'0');
  document.getElementById('call-timer').textContent = `${mm}:${ss}`;
}

function toggleMute() {
  if (!activeCall) return;
  const muted = !activeCall.isMuted();
  activeCall.mute(muted);
  const btn = document.getElementById('btn-mute');
  btn.classList.toggle('muted', muted);
  btn.textContent = muted ? '🔇 Unmute' : '🎙 Mute';
}

function hangup() {
  if (activeCall) { activeCall.disconnect(); activeCall = null; }
  setCallActive(false);
}

async function callMember() {
  if (!selectedMember) return toast('Select a member first');
  try {
    const r = await fetch('api/browser-call', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ phone: selectedMember.phone||'', profileId: selectedMember.profile_id, name: selectedMember.name||'' })
    });
    const d = await r.json();
    if (d.success) toast('📞 Calling member…');
    else toast('Call failed: '+(d.error||'unknown'));
  } catch(e) { toast('Call error: '+e.message); }
}

async function escalate() {
  if (!selectedMember) return toast('Select a member first');
  try {
    const r = await fetch('api/escalate-call', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ profileId: selectedMember.profile_id, reason:'care_team_requested' })
    });
    const d = await r.json();
    toast(d.success ? '⬆ Escalated to Flex agent' : 'Escalation failed: '+(d.error||''));
  } catch(e) { toast('Error: '+e.message); }
}

async function sendSms() {
  if (!selectedMember) return toast('Select a member first');
  const msg = prompt(`SMS to ${selectedMember.name}:`, selectedMember.next_follow_up||'');
  if (!msg) return;
  try {
    const r = await fetch('api/send-sms', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ name: selectedMember.name||'', phone: selectedMember.phone||'', customBody: msg })
    });
    const d = await r.json();
    toast(d.success ? '💬 SMS sent' : 'SMS failed: '+(d.error||''));
  } catch(e) { toast('Error: '+e.message); }
}

// ── Incoming call ──────────────────────────────────────────────────────────
function acceptCall() {
  if (!incomingCall) return;
  incomingCall.accept();
  activeCall = incomingCall; incomingCall = null;
  document.getElementById('incoming-overlay').classList.remove('show');
  setCallActive(true, 'Inbound call connected');
}
function rejectCall() {
  if (incomingCall) { incomingCall.reject(); incomingCall = null; }
  document.getElementById('incoming-overlay').classList.remove('show');
}

// ── Twilio Device ──────────────────────────────────────────────────────────
async function initDevice() {
  try {
    const r = await fetch('api/browser-call-token');
    const { token } = await r.json();
    if (!token) return;
    twilioDevice = new Twilio.Device(token, { logLevel: 1 });
    twilioDevice.on('incoming', call => {
      incomingCall = call;
      document.getElementById('incoming-from').textContent = call.parameters?.From || 'Unknown';
      document.getElementById('incoming-overlay').classList.add('show');
      call.on('cancel', () => { document.getElementById('incoming-overlay').classList.remove('show'); incomingCall = null; });
    });
    twilioDevice.on('error', e => toast('Voice error: '+e.message));
    await twilioDevice.register();
    toast('🟢 Agent online — ready for calls', 3000);
  } catch(e) { console.warn('Device init failed', e); }
}

// ── Verify ────────────────────────────────────────────────────────────────
async function startVerify() {
  if (!selectedMember?.phone) return toast('No phone number for this member');
  const btn = document.getElementById('btn-verify');
  btn.textContent = '⏳ Sending…'; btn.disabled = true;
  try {
    const r = await fetch('api/verify/send', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ phone: selectedMember.phone }),
    });
    const d = await r.json();
    if (d.success) {
      toast('📱 Verification SMS sent to member');
      document.getElementById('verify-otp-row').style.display = '';
      document.getElementById('otp-input').focus();
      document.getElementById('verify-result').textContent = '';
      btn.textContent = '🔄 Resend Code';
    } else {
      toast('Send failed: ' + (d.error || 'unknown'));
    }
  } catch(e) { toast('Error: ' + e.message); }
  finally { btn.disabled = false; }
}

async function checkOtp() {
  const code = document.getElementById('otp-input').value.trim();
  if (!code) return;
  const resultEl = document.getElementById('verify-result');
  resultEl.textContent = 'Checking…'; resultEl.style.color = 'var(--text-muted)';
  try {
    const r = await fetch('api/verify/check', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ phone: selectedMember.phone, code }),
    });
    const d = await r.json();
    if (d.valid) {
      resultEl.textContent = '✅ Member verified'; resultEl.style.color = '#16a34a';
      document.getElementById('btn-verify').textContent = '✅ Verified';
      document.getElementById('btn-verify').disabled = true;
    } else {
      resultEl.textContent = '❌ Invalid code — ask member to try again'; resultEl.style.color = '#dc2626';
      document.getElementById('otp-input').value = '';
      document.getElementById('otp-input').focus();
    }
  } catch(e) { resultEl.textContent = 'Error: ' + e.message; resultEl.style.color = '#dc2626'; }
}

function cancelVerify() {
  document.getElementById('verify-otp-row').style.display = 'none';
  document.getElementById('otp-input').value = '';
  document.getElementById('verify-result').textContent = '';
  const btn = document.getElementById('btn-verify');
  btn.textContent = '🔐 Verify Member'; btn.disabled = false;
}

// Also submit OTP on Enter key
document.getElementById('otp-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkOtp(); });

// ── Init ───────────────────────────────────────────────────────────────────
loadMembers();
setInterval(loadMembers, 30000);
initDevice();
</script>
</body>
</html>
