<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 40" fill="none">
  <!-- Red badge circle -->
  <circle cx="20" cy="20" r="20" fill="#F22F46"/>

  <!-- White medical plus sign -->
  <rect x="9" y="15.5" width="22" height="9" rx="2" fill="white"/>
  <rect x="15.5" y="9" width="9" height="22" rx="2" fill="white"/>

  <!-- Wordmark: "Owl" bold dark -->
  <text x="48" y="18"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="16" font-weight="800" fill="#0D122B">Owl</text>

  <!-- Wordmark: "Health" red -->
  <text x="48" y="34"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="13" font-weight="600" fill="#F22F46" letter-spacing="1">Health</text>
</svg>
